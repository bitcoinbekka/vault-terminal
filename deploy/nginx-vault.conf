# Vault Terminal — self-hosted nginx deployment
#
# HOW THIS ELIMINATES CORS:
#   The browser refuses to read Yahoo/CBOE responses because they send no
#   Access-Control-Allow-Origin headers. By serving the app AND a reverse
#   proxy for /yahoo/ and /cboe/ from the SAME origin, every request is
#   same-origin and no CORS headers are needed at all. No third-party proxy
#   required — this works even if proxy.shakespeare.diy is down.
#
# SETUP:
#   1. Build the app with the market base set to your domain:
#        VITE_MARKET_BASE=https://vault.example.com npm run build
#      (or export it, or put it in a .env file: VITE_MARKET_BASE=...)
#   2. Copy this file to /etc/nginx/sites-available/vault-terminal,
#      symlink it into sites-enabled, adjust server_name/root/paths.
#   3. Point dist/ (or your built files) at the `root` below.
#   4. Enable TLS (wss relays + crypto APIs require a secure context):
#        sudo certbot --nginx -d vault.example.com
#   5. Reload: sudo nginx -s reload
#
# REQUIRES: nginx with the SSL module (nginx-full or the default distro nginx
# plus certbot). No Node.js needed at runtime — only to build.

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;   # <-- your domain

    root /var/www/vault/dist;        # <-- your built dist/ directory
    index index.html;

    # Static assets: long cache, immutable (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — all non-file paths fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Market data reverse proxies (same-origin, no CORS) ----

    # Yahoo Finance: /yahoo/v8/finance/chart/AAPL?... -> https://query1.finance.yahoo.com/v8/...
    location /yahoo/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # CBOE options: /cboe/api/global/delayed_quotes/options/AAPL.json -> https://cdn.cboe.com/api/...
    location /cboe/ {
        proxy_pass https://cdn.cboe.com/;
        proxy_set_header Host cdn.cboe.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Basic security headers (optional but nice)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Optional: gzip for the JSON feeds
    gzip on;
    gzip_types application/json text/css application/javascript;
}

# Once certbot has run it will convert this to TLS (listen 443 ssl;
# http2 on; ssl_certificate ...) and keep port 80 for redirects.
