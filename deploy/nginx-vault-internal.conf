# Vault Terminal — nginx on an INTERNAL port (for Caddy-fronted hosts)
#
# Use this instead of nginx-vault.conf when another process already owns ports
# 80/443 on the host — e.g. a Caddy container (torii-quest-web) that must keep
# them. Caddy fronts Vault and handles TLS; nginx listens on 127.0.0.1:8081
# and serves the app + the /yahoo /cboe reverse proxies.
#
# Setup (Option B — Caddy owns 80/443):
#   1. Build with your domain:
#        VITE_MARKET_BASE=https://vault.plebeian.build npm run build
#   2. Install THIS config:
#        sudo cp deploy/nginx-vault-internal.conf /etc/nginx/sites-available/vault-terminal
#        sudo sed -i 's/vault\.example\.com/vault.plebeian.build/' /etc/nginx/sites-available/vault-terminal
#        sudo ln -s /etc/nginx/sites-available/vault-terminal /etc/nginx/sites-enabled/
#        sudo systemctl enable --now nginx        # (stop anything on 80 first)
#   3. Add a site block to the Caddyfile (in the torii-quest-web container):
#        vault.plebeian.build {
#            reverse_proxy 172.17.0.1:8081
#        }
#      (upstream = 172.17.0.1:8081 for bridge networking, 127.0.0.1:8081 for
#      host networking — see the DEPLOY.md appendix)
#   4. Reload Caddy (it auto-issues the TLS cert — no certbot needed).
#   5. No certbot step. DNS must resolve vault.plebeian.build to this VPS.
#
# NOTE: nginx listens on ALL interfaces (port 8081) because Caddy runs inside
# a Docker bridge network and must reach nginx via the bridge gateway — the
# container cannot reach 127.0.0.1 on the host. Only Caddy forwards to this
# port; it is not exposed publicly. Keep the /yahoo & /cboe proxies —
# same-origin from the browser's point of view, so no CORS at all.

server {
    listen 8081;
    server_name vault.example.com;   # <-- your domain (internal; Caddy matches it)

    root /var/www/vault/dist;        # <-- your built dist/ directory
    index index.html;

    # Static assets: long cache, immutable (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — all non-file paths fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Market data reverse proxies (same-origin, no CORS) ----

    # Yahoo Finance: /yahoo/v8/finance/chart/AAPL?... -> https://query1.finance.yahoo.com/v8/...
    location /yahoo/ {
        proxy_pass https://query1.finance.yahoo.com/;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # CBOE options: /cboe/api/global/delayed_quotes/options/AAPL.json -> https://cdn.cboe.com/api/...
    location /cboe/ {
        proxy_pass https://cdn.cboe.com/;
        proxy_set_header Host cdn.cboe.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Basic security headers (optional but nice)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Optional: gzip for the JSON feeds
    gzip on;
    gzip_types application/json text/css application/javascript;
}
